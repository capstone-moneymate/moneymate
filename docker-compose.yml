services:
  db:
    image: postgres:16
    container_name: moneymate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moneymate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneymate}
      POSTGRES_DB: ${POSTGRES_DB:-moneymate}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 빈 DB가 처음 만들어질 때 001_init.sql 등이 파일명 순서로 자동 실행된다.
      # 이미 만든 DB에는 다시 실행되지 않는다 -> docs/conventions.md 의 "마이그레이션" 참고
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moneymate} -d ${POSTGRES_DB:-moneymate}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 판단 채점 서버 (A, worker/judge_api.py). Spring 의 /api/judgement 가 http://localhost:8000/judge 를 부른다
  judge:
    build: ./worker
    container_name: moneymate-judge
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # 컨테이너 안에서는 localhost 가 아니라 db 서비스 이름으로 접속한다 (.env 의 DATABASE_URL 보다 우선)
      DATABASE_URL: postgresql://${POSTGRES_USER:-moneymate}:${POSTGRES_PASSWORD:-moneymate}@db:5432/${POSTGRES_DB:-moneymate}
      TZ: Asia/Seoul
    ports:
      - "${JUDGE_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
