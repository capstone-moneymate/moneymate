<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MONEYMATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* white ground, one blue point colour, chunky pressable controls */
:root{
  --bg:#FFFFFF;--ink:#2B3344;--sub:#6B7688;--faint:#9AA4B5;--line:#E3E8EF;--mist:#F3F6FA;
  --blue:#3B8DFF;--blue-deep:#2A6FD6;--blue-soft:#EAF3FF;--blue-ink:#1F5FC4;
  --butter:#FFC94D;--butter-soft:#FFF4D1;--butter-ink:#8A5A00;
  --up:#F0506A;--up-soft:#FFE6EA;--down:#4F63D2;--down-soft:#E6E9FB;
  --ok:#2FAE6B;--ok-soft:#E2F6EA;--ok-ink:#1B7A48;--no-soft:#FFE6EA;--no-ink:#C22F49;
  --display:"Bagel Fat One","Pretendard Variable",Pretendard,system-ui,sans-serif;
  --body:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --pad:20px;--ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:#EEF2F7;-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:430px;height:100%;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#s-home,#s-lab,#s-me{bottom:calc(66px + env(safe-area-inset-bottom))}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.wordmark{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:1;color:var(--blue)}

.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:16px;font-weight:800;font-size:17px;
  background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep);text-decoration:none;
  transition:transform .1s var(--ease-out),box-shadow .1s var(--ease-out),background .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-deep)}
.btn[disabled]{background:var(--line);color:var(--faint);box-shadow:none;cursor:default;transform:none}
.btn.ghost{margin-top:12px;background:#fff;color:var(--blue-ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.textbtn{display:block;width:100%;height:40px;font-weight:700;font-size:15px;color:var(--sub)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:800;background:var(--blue-soft);color:var(--blue-ink);white-space:nowrap}
.chip.solid{background:var(--blue);color:#fff}
.chip.gray{background:var(--mist);color:var(--sub)}
.chip.butter{background:var(--butter-soft);color:var(--butter-ink)}
.pills{display:flex;gap:8px}
.pills button{height:40px;padding:0 18px;border-radius:99px;border:2px solid var(--line);font-weight:800;font-size:15px;color:var(--sub);background:#fff}
.pills button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.box{border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;background:#fff}

/* ---------- auth ---------- */
.auth-top{flex:0 0 auto;padding:14px var(--pad) 6px}
.auth-top a.back{display:inline-flex;align-items:center;height:36px;font-weight:700;font-size:14px;text-decoration:none;color:var(--sub)}
.auth-top .who{display:flex;align-items:flex-end;gap:12px;margin-top:10px}
.auth-top .who svg{flex:0 0 84px;width:84px;height:84px}
.auth-top h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2}
.sheet{flex:1;min-height:0;padding:18px var(--pad) 24px;overflow-y:auto}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:800;font-size:14px;margin-bottom:6px}
.field input{width:100%;height:54px;border-radius:16px;border:2px solid var(--line);padding:0 16px;font-size:16px;font-weight:600;background:var(--mist);outline:none}
.field input:focus{border-color:var(--blue);background:#fff}
.field input::placeholder{color:var(--faint);font-weight:500}
.err{min-height:22px;font-size:13.5px;font-weight:700;color:var(--no-ink);margin:2px 0 10px}
.err.ok{color:var(--ok-ink)}
.alt{margin-top:18px;text-align:center;font-size:14.5px;font-weight:600;color:var(--sub)}
.alt a{color:var(--blue-ink);font-weight:800;text-underline-offset:4px}
.terms{margin-top:14px;font-size:12.5px;line-height:1.55;color:var(--faint);font-weight:500;text-align:center}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}

/* ---------- tabs ---------- */
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;border-top:2px solid var(--line);background:#fff;padding:7px 12px calc(7px + env(safe-area-inset-bottom))}
.tabs button{flex:1;height:50px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:800;color:var(--faint)}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--blue-ink);background:var(--blue-soft)}

/* ---------- home ---------- */
.home-head{flex:0 0 auto;padding:12px var(--pad) 10px;position:relative;z-index:3}
#s-home .scroll{display:flex;flex-direction:column}
.home-head .row{display:flex;align-items:center;gap:8px}
.home-head .logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.home-head .logo svg{width:34px;height:34px}
.home-head .wordmark{font-size:21px}
.icon{flex:0 0 42px;height:42px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.icon svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon[aria-expanded="true"]{background:var(--blue-soft);border-color:var(--blue)}
.trend{margin-top:10px;border:2px solid var(--line);border-radius:18px;position:relative}
.trend-bar{width:100%;display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;font-size:15px;font-weight:800;text-align:left}
.trend-bar .roll{flex:1;min-width:0;height:46px;overflow:hidden;position:relative}
.trend-bar .roll span{position:absolute;inset:0;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .5s var(--ease-out),opacity .5s}
.trend-bar .roll span i,.trend-list i{font-style:normal;color:var(--blue-ink);font-weight:800;min-width:14px}
.trend-bar .roll span.out{transform:translateY(-100%);opacity:0}
.trend-bar .roll span.in{transform:translateY(100%);opacity:0}
.trend-bar > svg{flex:0 0 18px;width:18px;height:18px;fill:none;stroke:var(--sub);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease-out)}
.trend-bar[aria-expanded="true"] > svg{transform:rotate(180deg)}
.trend-list{list-style:none;position:absolute;left:-2px;right:-2px;top:100%;margin-top:6px;padding:6px;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 12px 28px rgba(43,51,68,.14)}
.trend-list button{width:100%;display:flex;gap:10px;align-items:center;height:40px;padding:0 8px;border-radius:10px;font-weight:700;font-size:15px;text-align:left}
.trend-list button:active{background:var(--mist)}
.drawer{margin-top:10px}
.drawer input{width:100%;height:46px;border-radius:14px;border:2px solid var(--blue);padding:0 14px;font-size:16px;font-weight:600;outline:none}
.drawer p{border-radius:14px;background:var(--mist);padding:12px 14px;font-size:14px;font-weight:600;color:var(--sub)}
.home-body{flex:1 0 auto;display:flex;flex-direction:column;padding:6px var(--pad) 10px}
.home-body .h-sec{margin:14px 0 8px}
.h-sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 10px}
.h-sec h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.h-sec small{font-size:13px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.slider{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--pad)*-1);padding:2px var(--pad) 6px;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.ncard{flex:0 0 86%;scroll-snap-align:center;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:22px;padding:13px 16px;min-height:132px;display:flex;flex-direction:column;background:#fff;transition:transform .1s var(--ease-out)}
.ncard:active{transform:translateY(2px)}
.ncard .meta{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--faint)}
.ncard strong{display:block;margin-top:9px;font-size:17px;line-height:1.38;font-weight:800;letter-spacing:-.02em}
.ncard .foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:6px}
.ncard .fig{margin-left:auto;font-family:var(--display);font-size:20px;color:var(--up);line-height:1}
.ncard .fig.done{font-family:var(--body);font-size:12.5px;font-weight:800;color:var(--ok-ink);background:var(--ok-soft);height:26px;padding:0 10px;border-radius:99px;display:inline-flex;align-items:center}
.dots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .25s var(--ease-out),background .25s}
.dots i.on{width:20px;background:var(--blue)}
.stock{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px;margin-top:12px}
.stock .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stock .tk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stock .tk b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1}
.stock .tk span.nm{font-size:13.5px;font-weight:600;color:var(--sub)}
.stock .price{text-align:right;font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stock .price small{display:block;font-family:var(--body);font-size:13px;font-weight:800;margin-top:3px}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;font-weight:600;color:var(--sub)}
.legend i{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--butter);vertical-align:middle;margin-right:4px}
.legend i.dash{border-top:2px dashed var(--faint)}
.candle-wrap{position:relative;flex:1;min-height:80px;margin-top:6px;touch-action:pan-y}
.candle-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tip{position:absolute;top:0;left:0;transform:translate(-50%,-100%);background:var(--ink);color:#fff;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:600;line-height:1.4;pointer-events:none;width:max-content;max-width:210px;z-index:2}
.tip b{display:block;font-weight:800;font-size:12.5px}
.mk{cursor:pointer;outline:none}
.mk:focus-visible{stroke:var(--butter);stroke-width:3}
.stock .hint{font-size:12px;font-weight:600;color:var(--faint);margin-top:6px;padding-bottom:10px;border-bottom:2px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oxrow{display:flex;align-items:center;gap:8px;margin-top:12px}
.oxrow p{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.35}
.oxdone{margin-top:10px}
.oxdone p{font-size:15px;font-weight:800;line-height:1.35}
.oxdone p b{color:var(--blue-ink)}
.btn.sm{height:42px;margin-top:8px;border-radius:14px;font-size:15px}
.oxrow button{flex:0 0 auto;height:46px;padding:0 14px;border-radius:14px;font-weight:800;font-size:15px;transition:transform .1s var(--ease-out),box-shadow .1s var(--ease-out),opacity .2s}
.oxrow .o{background:var(--up-soft);color:var(--up);box-shadow:0 4px 0 #F7BFC8}
.oxrow .x{background:var(--down-soft);color:var(--down);box-shadow:0 4px 0 #C3CAF2}
.oxrow button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.oxrow button[disabled]{box-shadow:none;transform:translateY(3px);cursor:default}
.oxrow button.dim{opacity:.35}
.ox-r{margin-top:12px;border-radius:14px;background:var(--blue-soft);padding:12px 14px;font-size:14.5px;font-weight:600;line-height:1.5}
.ox-r b{color:var(--blue-ink)}
.plist{list-style:none;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.plist li{flex:1 1 60px;min-height:58px;max-height:74px}
.plist button{width:100%;height:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:6px 12px}
.plist .dt{flex:0 0 46px;height:46px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;align-content:center;font-family:var(--display);font-size:19px;line-height:1.05}
.plist .dt small{font-family:var(--body);font-size:11.5px;font-weight:700;opacity:.9}
.plist .tt{flex:1;min-width:0;font-weight:800;font-size:15.5px;line-height:1.35}
.eg{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--faint);text-align:center}
.none{padding:22px 8px;text-align:center;font-size:14.5px;font-weight:600;color:var(--sub)}

/* ---------- learn ---------- */
.l-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px var(--pad) 8px}
.l-top .close{flex:0 0 40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.l-top .close svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;fill:none}
.bar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .45s var(--ease-out)}
.flame{flex:0 0 auto;display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:17px}
.flame svg{width:16px;height:18px}
.l-body{padding:8px var(--pad) 20px}
.l-body > *{animation:stepIn .4s var(--ease-out) both}
@keyframes stepIn{from{opacity:0;transform:translateX(18px)}}
.l-foot{flex:0 0 auto;padding:10px var(--pad) calc(16px + env(safe-area-inset-bottom));display:grid;gap:6px;background:#fff}
.l-foot.ok,.l-foot.no,.l-foot.hm{border-radius:24px 24px 0 0;padding-top:18px;animation:sheetUp .35s var(--ease-out) both}
.l-foot.hm{background:var(--butter-soft)}
.l-foot.hm .verdict{color:var(--butter-ink)}
.two{display:grid;grid-template-columns:1fr 1.15fr;gap:8px}
.two .btn.ghost{margin-top:0}
.l-foot.ok{background:var(--ok-soft)}.l-foot.no{background:var(--no-soft)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
.verdict{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}
.verdict svg{flex:0 0 30px;width:30px;height:30px}
.l-foot.ok .verdict{color:var(--ok-ink)}.l-foot.no .verdict{color:var(--no-ink)}
.l-foot .why{font-size:15px;line-height:1.55;font-weight:500;margin:4px 0 10px}
.l-foot.ok .btn{background:var(--ok);box-shadow:0 4px 0 var(--ok-ink)}
.l-foot.no .btn{background:var(--up);box-shadow:0 4px 0 var(--no-ink)}
.nstage{height:290px;border-radius:28px;background:var(--blue-soft);position:relative;overflow:hidden;margin-top:12px}
.nstage::before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:#D5E7FF;right:-70px;top:26px}
.nstage svg{position:absolute;right:14px;bottom:-40px;width:236px;height:236px}
.nlabel{margin-top:20px;font-size:14.5px;font-weight:700;color:var(--sub)}
.nhead{font-size:32px;line-height:1.24;font-weight:800;letter-spacing:-.03em;margin-top:4px;white-space:pre-line}
.nbody{font-size:16.5px;line-height:1.6;font-weight:500;color:var(--sub);margin-top:10px}
.nstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.nstats div{border-radius:16px;background:var(--mist);padding:12px 14px;font-size:13px;font-weight:600;color:var(--sub);line-height:1.4}
.nstats b{display:block;font-size:19px;font-weight:800;color:var(--ink);margin:2px 0}
.say{display:flex;align-items:flex-end;gap:8px}
.say svg{flex:0 0 78px;width:78px;height:78px}
.say .bub{flex:1;min-width:0;border:2px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 14px}
.say .bub small{display:block;font-size:13px;font-weight:800;color:var(--blue-ink)}
.say .bub p{font-size:18.5px;line-height:1.38;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.concept{margin-top:14px;padding:18px 18px 20px}
.concept .kw{font-family:var(--display);font-weight:400;font-size:36px;line-height:1.2;color:var(--blue);margin-top:14px}
.concept .def{font-size:19.5px;line-height:1.45;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.pts{list-style:none;display:grid;gap:8px;margin-top:14px}
.pts li{display:flex;gap:10px;border-radius:14px;background:var(--mist);padding:12px 14px;font-size:15px;line-height:1.55;font-weight:500}
.pts li::before{content:"";flex:0 0 10px;height:10px;margin-top:7px;border-radius:50%;border:2.5px solid var(--butter)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:10px 14px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;font-weight:700;font-size:16.5px;line-height:1.35;transition:background .15s,border-color .15s,transform .1s}
.opt .k{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--mist);color:var(--sub);font-weight:800;font-size:14px}
.opt[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue)}
.opt[aria-pressed="true"] .k{background:var(--blue);color:#fff}
.opt.right{background:var(--blue);border-color:var(--blue-deep);color:#fff}
.opt.right .k{background:var(--butter);color:var(--ink)}
.opt.wrong{background:var(--no-soft);border-color:#F7BFC8;animation:shake .35s}
.opt.wrong .k{background:#fff;color:var(--no-ink)}
.opt[disabled]{cursor:default}
.opt.shown{background:var(--blue-soft);border-color:#C9DFFF}
.opt.shown .k{background:var(--blue);color:#fff}
.opt.k-empty .k{background:#fff;border:2px dashed #C6CEDA;color:transparent}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pair button{text-align:left;padding:14px;transition:background .15s,border-color .15s}
.pair button b{display:block;font-size:16px;font-weight:800;line-height:1.3;min-height:42px}
.pair button svg{display:block;width:100%;height:92px;margin:6px 0}
.pair button small{font-size:12px;font-weight:600;color:var(--faint)}
.pair button[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue)}
.pair button.right{border-color:var(--ok);background:var(--ok-soft)}
.pair button.wrong{border-color:#F7BFC8;background:var(--no-soft)}
.ctx{margin-top:14px;border-radius:16px;background:var(--mist);padding:14px 16px;font-size:15.5px;line-height:1.6;font-weight:600}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.choices button{height:52px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;font-weight:800;font-size:15.5px;background:#fff;transition:background .15s,border-color .15s}
.choices button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue-deep);color:#fff}
.reason{display:block;margin-top:16px}
.reason span{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:8px}
.reason span i{font-style:normal;color:var(--up)}
.reason span em{font-style:normal;font-weight:700;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.reason textarea{display:block;width:100%;height:128px;resize:none;border-radius:18px;border:2px solid var(--line);padding:14px 16px;font-size:16px;line-height:1.55;font-weight:500;outline:none}
.reason textarea:focus{border-color:var(--blue)}
.sample{margin-top:10px;height:40px;padding:0 16px;border-radius:99px;border:2px solid var(--line);font-weight:800;font-size:14px;color:var(--blue-ink)}
.fb{margin-top:10px;padding:14px 16px}
.fb.also{background:var(--butter-soft);border-color:#F6DF9E}
.fb h3{font-size:16px;font-weight:800;color:var(--blue-ink);display:flex;justify-content:space-between;align-items:baseline}
.fb.also h3{color:var(--butter-ink)}
.fb h3 em{font-style:normal;font-family:var(--display);font-weight:400;font-size:20px}
.fb p{font-size:15px;line-height:1.6;font-weight:500;margin-top:4px}
.rub{list-style:none;display:grid;gap:8px;margin-top:10px}
.rub li{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;line-height:1.4}
.rub li b{flex:0 0 78px;height:30px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.rub li.low b{background:var(--line);color:var(--sub)}
.mine{margin-top:10px;border-radius:16px;background:var(--mist);padding:12px 14px;font-size:14.5px;line-height:1.55;font-weight:500;overflow-wrap:anywhere}
.mine b{display:block;font-size:13px;font-weight:800;color:var(--sub);margin-bottom:2px}
.mine span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.done-top{text-align:center}
.done-top svg{width:124px;height:124px}
.done-top h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.2;margin-top:4px}
.done-top p{font-size:15px;font-weight:600;color:var(--sub);margin-top:4px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.score{border-radius:18px;background:var(--mist);padding:12px 6px;text-align:center}
.score.main{background:var(--butter)}
.score span{display:block;font-size:13px;font-weight:700}
.score b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15}
.score b small{font-family:var(--body);font-size:13px;font-weight:800;margin-left:1px}
.did{list-style:none;margin-top:8px;display:grid;gap:8px;color:var(--blue)}
.did li{display:flex;gap:10px;align-items:center;border-radius:14px;background:var(--mist);padding:12px 14px;font-size:15px;font-weight:700}
.did li span{color:var(--ink)}
.did svg{flex:0 0 24px;width:24px;height:24px}
.nextup{font-size:14.5px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.nextup b{display:block;font-size:12.5px;font-weight:800;color:var(--blue-ink)}

/* ---------- me ---------- */
.me-head{flex:0 0 auto;padding:14px var(--pad) 12px;display:flex;align-items:center;gap:12px}
.avatar{flex:0 0 62px;height:62px;border-radius:50%;background:var(--blue-soft);border:3px solid var(--blue);display:grid;place-items:center;overflow:hidden}
.avatar svg{width:52px;height:52px}
.me-head .who{flex:1;min-width:0}
.me-head .nick{font-size:21px;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-head .chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.me-head .chips .chip{height:30px;font-size:13px}
.me-head .chips .chip.line{background:#fff;border:2px solid var(--line);color:var(--ink)}
.me-head .out{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--faint);padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.subtabs{flex:0 0 auto;display:flex;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.subtabs button{flex:1;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13.5px;font-weight:800;color:var(--faint);position:relative}
.subtabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.subtabs button[aria-selected="true"]{color:var(--blue-ink)}
.subtabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;background:var(--blue);border-radius:4px 4px 0 0}
.me-body{padding:16px var(--pad) 22px}
.me-body h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.months{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--pad)*-1);padding:2px var(--pad) 6px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.month{flex:0 0 90%;scroll-snap-align:center;padding:16px 12px 14px}
.month h3{text-align:center;font-size:17px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 2px;margin-top:10px;text-align:center}
.cal span{font-size:12.5px;font-weight:700;color:var(--sub);padding-bottom:2px}
.cal em{font-style:normal;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;max-width:42px;width:100%;margin:0 auto}
.cal em.future{color:var(--faint)}
.cal em.done{background:var(--blue);color:#fff}
.cal em.today{box-shadow:0 0 0 2.5px var(--ink)}
.cal button.d{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;max-width:42px;width:100%;margin:0 auto;background:var(--blue);color:#fff}
.cal button.d.today{box-shadow:0 0 0 2.5px var(--ink)}
.cal button.d[aria-pressed="true"]{background:var(--blue-deep);box-shadow:0 0 0 3px var(--butter)}
.dayp{margin-top:12px}
.dayp h3{font-size:15px;font-weight:800;margin-bottom:8px}
.redo{list-style:none;display:grid;gap:8px;max-height:196px;overflow-y:auto;scrollbar-width:none}
.redo::-webkit-scrollbar{display:none}
.redo button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left}
.redo .tt{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.35}
.note{margin-top:12px;border-radius:18px;background:var(--butter-soft);padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;line-height:1.5}
.note svg{flex:0 0 46px;width:46px;height:46px}
.mlegend{display:flex;gap:6px;flex-wrap:wrap}
.mlegend span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:2px solid var(--line);font-size:13px;font-weight:700}
.mlegend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--up)}
.mlegend i.dn{border-color:var(--down)}
.mlegend i.wh{border-top:3px dashed var(--butter)}
.mlegend i.re{width:10px;height:10px;border:0;border-radius:50%;background:var(--up)}
.mapwrap{position:relative;margin-top:12px}
.zoom{position:absolute;right:10px;bottom:12px;display:flex;gap:6px}
.zoom button{min-width:40px;height:40px;padding:0 12px;border-radius:99px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:15px;color:var(--ink)}
.zoom button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.zoom button[disabled]{color:var(--faint);box-shadow:none;cursor:default;transform:none}
.map{height:400px;overflow:auto;touch-action:pan-x pan-y;border-radius:22px;border:2px solid var(--line);border-bottom-width:4px;background-color:#fff;background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:22px 22px;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
.map .canvas{position:relative;transform-origin:0 0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map svg path{fill:none;stroke-width:3;stroke-linecap:round}
.node{position:absolute;height:36px;display:flex;align-items:center;justify-content:center;padding:0 8px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.root{background:var(--ink);border-color:var(--ink);color:#fff;border-radius:99px}
.node.theme{background:var(--blue);border-color:var(--blue-deep);color:#fff;border-radius:99px;cursor:pointer}
.node.theme[aria-expanded="false"]{background:var(--blue-soft);color:var(--blue-ink);border-color:#C9DFFF}
.node.up{border-color:#F7BFC8}.node.down{border-color:#C3CAF2}
.node.whale{border:2px dashed var(--butter);background:var(--butter-soft);color:var(--butter-ink)}
.node.re::after{content:"";position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--up)}
.maphint{display:table;margin:12px auto 0;background:var(--ink);color:#fff;border-radius:99px;padding:9px 16px;font-size:13.5px;font-weight:700}
.empty{text-align:center;padding:26px 16px}
.empty svg{width:96px;height:96px}
.empty p{margin:8px 0 16px;font-size:15px;font-weight:600;color:var(--sub)}

/* ---------- tab 2: 분석 자료 ---------- */
.lab-head{flex:0 0 auto;padding:12px var(--pad) 0;position:relative;z-index:3}
.lab-head .row{display:flex;align-items:center;gap:8px}
.lab-head h1{flex:1;font-size:22px;font-weight:800;letter-spacing:-.02em}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cats button{height:36px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:800;color:var(--sub);white-space:nowrap}
.cats button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
#s-lab .scroll{display:flex;flex-direction:column}
.lab-body{flex:1 0 auto;display:flex;flex-direction:column;padding:14px var(--pad) 12px}
.lab-body .h-sec{margin:16px 0 8px}
.lab-body .slider{scroll-padding-left:var(--pad)}
.banner{display:flex;align-items:center;gap:12px;border-radius:22px;background:var(--blue);color:#fff;padding:14px 16px;box-shadow:0 4px 0 var(--blue-deep)}
.banner svg{flex:0 0 78px;width:78px;height:78px}
.banner small{display:block;font-size:13px;font-weight:800;color:var(--butter)}
.banner strong{display:block;font-size:17px;font-weight:800;line-height:1.35;margin:2px 0 10px}
.btn.butter{display:inline-flex;width:auto;height:40px;padding:0 18px;border-radius:13px;background:var(--butter);color:var(--ink);box-shadow:0 4px 0 #D9A21F;font-size:15px}
.btn.butter:active{box-shadow:0 1px 0 #D9A21F}
.tcard{flex:0 0 148px;scroll-snap-align:start;text-align:left;padding:13px;min-height:166px;display:flex;flex-direction:column;transition:transform .1s var(--ease-out)}
.tcard:active,.rcard:active{transform:translateY(2px)}
.tcard .bdg{align-self:flex-start;min-width:50px;height:42px;padding:0 9px;border-radius:13px;background:var(--c);display:grid;place-items:center;font-family:var(--display);font-size:14.5px;line-height:1}
.tcard b{display:block;margin-top:10px;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.tcard span.sub{display:block;margin-top:2px;font-size:13px;font-weight:600;color:var(--sub);line-height:1.4}
.tcard .chip{margin-top:auto;align-self:flex-start}
.chip.line{background:#fff;border:2px solid var(--line);color:var(--sub)}
.rcard{flex:0 0 76%;scroll-snap-align:start;text-align:left;padding:13px 16px;display:flex;flex-direction:column;gap:6px}
.rcard small{font-size:12.5px;font-weight:800;color:var(--blue-ink)}
.rcard b{font-size:16.5px;font-weight:800;letter-spacing:-.02em;line-height:1.38}
.rcard .chip{align-self:flex-start;margin-top:2px}
.ctx small{display:block;font-size:13px;font-weight:800;color:var(--blue-ink);margin-bottom:2px}
.stmt{margin-top:14px;padding:16px 18px;font-size:18px;font-weight:800;line-height:1.55;letter-spacing:-.02em}
.oxpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.oxpair button{padding:18px 0 14px;display:grid;justify-items:center;gap:8px;font-size:15.5px;font-weight:800;transition:background .15s,border-color .15s}
.oxpair svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round}
.oxpair button[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.oxpair button.right{background:var(--blue);border-color:var(--blue-deep);color:#fff}
.oxpair button.wrong{background:var(--no-soft);border-color:#F7BFC8;color:var(--no-ink)}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:92px;height:36px;margin:0 6px;padding:0 12px;border:2px dashed #C6CEDA;border-radius:11px;vertical-align:middle;font-size:16px}
.blank.fill{border:2px solid var(--blue);background:var(--blue);color:#fff}
.blank.fill.bad{border-color:#F7BFC8;background:var(--no-soft);color:var(--no-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{height:46px;padding:0 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:#fff;font-weight:800;font-size:15.5px}
.chips button[disabled]{opacity:.4;cursor:default}
.match{display:grid;gap:10px;margin-top:16px}
.mrow{display:grid;grid-template-columns:86px 1fr;gap:8px}
.mrow .ml{height:54px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;display:grid;place-items:center;font-family:var(--display);font-size:16px}
.mrow .mr{height:54px;border-radius:16px;border:2px dashed #C6CEDA;display:flex;align-items:center;padding:0 12px;text-align:left;font-weight:700;font-size:15px;line-height:1.3;color:var(--faint);width:100%}
.mrow.act .ml{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}
.mrow .mr.fill{border:2px solid var(--blue);background:var(--blue-soft);color:var(--ink)}
.mrow.ok .ml{background:var(--blue);border-color:var(--blue-deep);color:#fff}
.mrow.bad .ml{background:var(--no-soft);border-color:#F7BFC8;color:var(--no-ink)}
.mrow.bad .mr.fill{border-color:#F7BFC8;background:var(--no-soft)}
@media (max-height:760px){
  .lab-body{padding-top:10px}
  .lab-body .h-sec{margin:12px 0 6px}
  .banner{padding:11px 14px}
  .banner svg{flex-basis:64px;width:64px;height:64px}
  .tcard{min-height:146px;padding:11px}
  .rcard{padding:10px 14px;gap:4px}
  .cats{margin-top:8px;gap:6px}
  .cats button{height:34px}
  .lab-body .eg{display:none}
}

/* ---------- cheer (lesson complete) ---------- */
.cheer{position:fixed;z-index:60;top:0;bottom:0;left:50%;width:min(100vw,430px);transform:translateX(-50%);background:var(--blue);overflow:hidden;display:none;place-items:center}
.cheer.on{display:grid}
.cheer .ic{position:absolute;inset:0}
.cheer .ic svg{position:absolute;width:var(--s,30px);height:var(--s,30px);left:var(--x);top:var(--y);stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.9;transform:scale(0) rotate(var(--r,0deg));animation:pop .5s var(--ease-spring) var(--d,0s) forwards}
@keyframes pop{to{transform:scale(1) rotate(var(--r,0deg))}}
.cheer .rb{position:absolute;inset:0;width:100%;height:100%}
.cheer .rb path{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.cheer .r1{stroke:#fff;stroke-width:70;animation:draw .7s var(--ease-out) .1s forwards}
.cheer .r2{stroke:var(--butter);stroke-width:46;animation:draw .7s var(--ease-out) .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cheer h2{position:relative;color:#fff;font-family:var(--display);font-weight:400;font-size:46px;transform:scale(0);animation:pop .6s var(--ease-spring) .45s forwards}
.cheer.bye{transition:opacity .35s;opacity:0}

/* ---------- iPhone 16 (393 x 852) ----------
   On the phone the app fills the screen and keeps clear of the Dynamic Island and home indicator.
   On anything wider it is shown as a 393 x 852 frame. */
html,body{height:100dvh}
body{display:grid;place-items:center}
.app{width:100%;max-width:none;height:100%;margin:0}
.cheer{width:100vw}
.home-head,.lab-head,.l-top{padding-top:calc(12px + env(safe-area-inset-top))}
.auth-top,.me-head{padding-top:calc(14px + env(safe-area-inset-top))}
@media (min-width:600px){
  .app{max-width:393px;height:min(100%,852px);border-radius:40px;box-shadow:0 30px 80px rgba(43,51,68,.18)}
  .cheer{width:393px;height:min(100%,852px);top:50%;bottom:auto;transform:translate(-50%,-50%);border-radius:40px}
}
/* shorter visible area (browser toolbars showing): tighten the home screen so it still fits */
@media (max-height:760px){
  .home-body .h-sec{margin:10px 0 6px}
  .ncard{min-height:122px;padding-top:11px;padding-bottom:11px}
  .stock{padding:12px;margin-top:10px}
  .candle-wrap{min-height:60px}
  .eg{margin-top:6px}
  .stock .hint{display:none}
  .plist{gap:6px}
  .plist li{min-height:50px}
  .nstage{height:240px}
  .done-top svg{width:84px;height:84px}
  .did{gap:6px}
  .did li{padding:9px 14px}
  .map{height:320px}
  .fb{padding:10px 14px;margin-top:7px}
  .rub{gap:5px}
  .rub li b{height:26px}
  .mine{padding:9px 12px;margin-top:8px}
  .plist li{flex-basis:52px;min-height:52px}
  .plist .dt{flex-basis:42px;height:40px;font-size:16px}
  .plist .tt{font-size:14.5px}
  .eg{font-size:11px;margin-top:4px}
}
@media (max-height:700px){
  .stock .hint{display:none}
  .pills button{height:36px}
  .home-head{padding-bottom:6px}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="app">

  <section class="screen" id="s-login" hidden>
    <div class="auth-top">
      <a class="back" href="index.html">MONEYMATE 소개로</a>
      <div class="who"><span data-mate="hi"></span><h1>다시 왔네요,<br>오늘 뉴스 볼까요</h1></div>
    </div>
    <form class="sheet" id="f-login" novalidate>
      <label class="field"><span>아이디</span><input id="li-id" name="id" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="아이디를 입력하세요"></label>
      <label class="field"><span>비밀번호</span><input id="li-pw" name="pw" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요"></label>
      <p class="err" id="li-err" role="alert"></p>
      <button class="btn" type="submit">로그인</button>
      <p class="alt">처음이신가요? <a href="#signup">가입하기</a></p>
    </form>
  </section>

  <section class="screen" id="s-signup" hidden>
    <div class="auth-top">
      <a class="back" href="#login">로그인으로 돌아가기</a>
      <div class="who"><span data-mate="happy"></span><h1>하루 5분,<br>같이 시작해요</h1></div>
    </div>
    <form class="sheet" id="f-signup" novalidate>
      <label class="field"><span>아이디</span><input id="su-id" name="id" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="영문, 숫자 4~16자"></label>

function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'h'+(h>>>0).toString(36)}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}

function streak(u){var days=learnedDays(u),d=new Date(NOW),n=0;if(!days[ymd(d)])d=addDays(d,-1);while(days[ymd(d)]){n++;d=addDays(d,-1)}return n}

var SCREENS=['login','signup','home','lab','learn','me'], cur=null;
function show(name){
  cur=name;
  SCREENS.forEach(function(s){$('#s-'+s).hidden=s!==name});
  $('#tabs').hidden=!(name==='home'||name==='lab'||name==='me');
  $$('#tabs button').forEach(function(b){if(b.dataset.go===name)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
}
function go(name){if(location.hash==='#'+name)route();else location.hash=name}
function route(){
  var name=(location.hash||'').slice(1);
  if(name==='guest'){startGuest();return}
  if(SCREENS.indexOf(name)<0)name=me()?'home':'login';
  if(!me()&&name!=='login'&&name!=='signup'){location.replace('#login');return}
  if(me()&&(name==='login'||name==='signup')){location.replace('#home');return}
  if(name==='learn'&&!L){location.replace('#home');return}
  show(name);
  if(name==='home')renderHome();
  if(name==='lab')renderLab();
  if(name==='me'){MS=null;renderMe()}
  if(name==='learn')renderStep();
}

function bindScrub(w,revealed){

function nextLesson(id){

  for(var k=1;k<all.length;k++){var c=all[(at+k)%all.length];if(!done[c])return c}
  return null;
}

/* 규칙 기반 채점: 증거(뉴스 속 사실) 2, 추론(개념과 연결) 3, 반박(다른 힘 고려) 2 */
function feedback(){
  var l=L.l, j=l.judge, txt=L.reason.trim(), flat=txt.replace(/\s/g,'');
  var ev=Math.min(2,j.facts.filter(function(f){return flat.indexOf(f.replace(/\s/g,''))>-1}).length);
  var con=l.concepts.filter(function(c){return flat.indexOf(c.k.replace(/\s/g,''))>-1}).length;
  var link=/(그래서|때문|라서|니까|므로|따라서|으면|하면)/.test(txt)?1:0;
  var rs=Math.min(3,Math.min(2,con)+link+(con===1&&txt.length>=60?1:0));
  var cn=Math.min(2,(txt.match(/(하지만|다만|반대로|위험|그래도|수도|반면|변수|아니면)/g)||[]).length);
  var rub=[
    {n:'증거',v:ev,m:2,t:ev===2?'뉴스 속 사실을 근거로 썼어요.':ev===1?'뉴스 속 사실을 하나 더 넣어보세요.':'뉴스에 나온 숫자나 사실을 넣어보세요.'},
    {n:'추론',v:rs,m:3,t:rs===3?'개념을 이어서 판단까지 연결했어요.':rs>0?'오늘 배운 개념을 “그래서”로 이어보세요.':'‘'+l.concepts[0].k+'’ 같은 개념을 넣어보세요.'},
    {n:'반박',v:cn,m:2,t:cn===2?'다른 힘(위험)까지 고려했어요.':cn===1?'반대로 작용할 힘을 하나 더 떠올려보세요.':'“다만”으로 반대 경우도 적어보세요.'}];
  return {good:j.good[L.choice],alt:(j.alt||ALT)[L.choice],score:Math.round((ev+rs+cn)/7*100),rub:rub};
}
function finish(){
  var l=L.l, right=0, wrong=[], fb=L.fb||(L.fb=feedback());
  l.quizzes.forEach(function(q,i){var st=L.quiz[i], ok=!st.skip&&st.sel===q.a;if(ok)right++;if(!ok||st.unsure)wrong.push(q.c)});
  if(!L.order.skip&&L.order.pick.length===5&&L.order.pick.every(function(v,i){return v===i}))right++;
  if(L.chart.sel===l.chart.a)right++;
  var r={right:right,concept:Math.round(right/4*100),judge:fb.score};
  r.total=Math.round((r.concept+r.judge)/2);
  if(!L.saved){
    L.saved=true;
    var prev=me().done[L.id];
    me().done[L.id]={date:prev?prev.date:TODAY,total:r.total,concept:r.concept,judge:r.judge,wrong:wrong,choice:L.choice,reason:L.reason.trim()};
    save();
  }
  return r;
}

}

  node('div','root',X.root,W.root,ry,'나의 인과 지도');
  MG={w:CW,h:H,tx:X.theme,ty:tys[0]};
  return '<div class="mlegend"><span><i></i>올리는 힘</span><span><i class="dn"></i>누르는 힘</span><span><i class="wh"></i>큰손 기록</span><span><i class="re"></i>복습 필요</span></div>'+
    '<div class="mapwrap"><div class="map" id="map" tabindex="0" aria-label="나의 인과 지도. 테마 쪽으로 확대돼 있고, 줄이면 전체가 보여요"><div id="msizer"><div class="canvas" id="mcanvas" style="width:'+CW+'px;height:'+H+'px"><svg viewBox="0 0 '+CW+' '+H+'" aria-hidden="true">'+paths+'</svg>'+nodes+'</div></div></div>'+
    '<div class="zoom"><button data-z="out" aria-label="축소">−</button><button data-z="fit">전체</button><button data-z="in" aria-label="확대">+</button></div></div>'+
    '<p class="maphint">줄이면 전체가 보여요. 테마를 누르면 접고 펴요</p>';
}
/* 달력에서 고른 날에 배운 카드뉴스 목록. 누르면 그 카드뉴스의 문제부터 다시 풀어요. */
function dayPanel(u){
  if(!selDay)return '';
  var list=Object.keys(u.done).filter(function(id){return LESSONS[id]&&u.done[id].date===selDay});
  if(!list.length)return '';
  var p=selDay.split('-');
  return '<section class="dayp" aria-live="polite"><h3>'+(+p[1])+'월 '+(+p[2])+'일에 배운 카드뉴스</h3><ul class="redo">'+list.map(function(id){
    return '<li><button class="box" data-redo="'+id+'"><span class="tt">'+esc(LESSONS[id].title)+'</span><span class="chip butter">다시 풀기</span></button></li>'}).join('')+'</ul></section>';
}
function renderMe(){
  var u=me(), ids=Object.keys(u.done), days=learnedDays(u), st=streak(u), html;
  $('#nick').textContent=u.guest?'둘러보는 중':S.session+' 님';
  $('#logout').textContent=u.guest?'로그인하기':'로그아웃';
  $('#me-chips').innerHTML='<span class="chip butter">연속 학습 '+st+'일</span><span class="chip line">카드뉴스 '+ids.length+'장</span>';
  $$('.subtabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.me===meView)});
  if(meView==='cal'){
    html='<h2>학습 달력</h2><div class="months">'+[-2,-1,0].map(function(off){var m=new Date(NOW.getFullYear(),NOW.getMonth()+off,1);return monthCard(m.getFullYear(),m.getMonth(),days)}).join('')+'</div>'+
      dayPanel(u)+
      '<div class="note"'+(selDay&&days[selDay]?' hidden':'')+'>'+mate(st?'wink':'smile')+'<p>'+(st?st+'일째 이어가는 중이에요.':'오늘 뉴스 한 건을 배우면 첫 동그라미가 생겨요.')+'<br>'+(ids.length?'파란 날짜를 누르면 그날 문제를 다시 풀 수 있어요.':'파란 동그라미가 카드뉴스를 배운 날이에요.')+'</p></div>';
  }else if(!ids.length){
    html='<div class="empty">'+mate('think')+'<p>아직 배운 개념이 없어요.<br>뉴스 한 건을 배우면 원인과 결과가 여기에 이어져요.</p><button class="btn" data-go-home>오늘 뉴스 배우러 가기</button></div>';
  }else html=renderMap(u,ids);
  $('#me-body').innerHTML=html;
  var ms=$('.months'); if(ms)ms.scrollLeft=ms.scrollWidth; /* 이번 달이 맨 오른쪽, 왼쪽으로 넘기면 지난달 */
  if($('#map'))initMap();
}
function mapFit(){var m=$('#map');return Math.min(1,(m.clientWidth-4)/MG.w,(m.clientHeight-6)/MG.h)}
function setZoom(ns,keep){
  var m=$('#map'), s0=MS.s, fit=mapFit(); ns=Math.max(fit,Math.min(ZMAX,ns));
  var px=(m.scrollLeft+m.clientWidth/2)/s0, py=(m.scrollTop+m.clientHeight/2)/s0;
  MS.s=ns;
  $('#msizer').style.width=MG.w*ns+'px'; $('#msizer').style.height=MG.h*ns+'px';
  $('#mcanvas').style.transform='scale('+ns+')';
  if(keep!==false){m.scrollLeft=px*ns-m.clientWidth/2; m.scrollTop=py*ns-m.clientHeight/2}
  $('[data-z="out"]').disabled=ns<=fit+0.001; $('[data-z="fit"]').disabled=ns<=fit+0.001; $('[data-z="in"]').disabled=ns>=ZMAX-0.001;
}
/* 처음에는 첫 테마가 크게 보이도록 확대해서 열고, 줄이면 전체가 보여요 */
function initMap(){
  var m=$('#map');
  if(!MS){MS={s:ZSTART};setZoom(ZSTART,false);m.scrollLeft=MG.tx*ZSTART-14;m.scrollTop=Math.max(0,MG.ty*ZSTART-m.clientHeight/2)}
  else{var x=MS.x||0,y=MS.y||0;setZoom(MS.s,false);m.scrollLeft=x;m.scrollTop=y}
  MS.x=m.scrollLeft;MS.y=m.scrollTop;
  m.addEventListener('scroll',function(){MS.x=m.scrollLeft;MS.y=m.scrollTop},{passive:true});
  var d0=0,s0=1, dist=function(e){var a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};
  m.addEventListener('touchstart',function(e){if(e.touches.length===2){d0=dist(e);s0=MS.s}},{passive:true});
  m.addEventListener('touchmove',function(e){if(e.touches.length===2&&d0){e.preventDefault();setZoom(s0*dist(e)/d0)}},{passive:false});
  m.addEventListener('touchend',function(){d0=0});
  m.addEventListener('wheel',function(e){if(e.ctrlKey){e.preventDefault();setZoom(MS.s*(e.deltaY<0?1.1:0.9))}},{passive:false});
}
$('#me-body').addEventListener('click',function(e){
  var t=e.target.closest('[data-theme],[data-go-home],[data-z],[data-day],[data-redo]'); if(!t||t.disabled)return;
  if(t.dataset.day){selDay=selDay===t.dataset.day?null:t.dataset.day;var sx=$('.months').scrollLeft;renderMe();$('.months').scrollLeft=sx}
  else if(t.dataset.redo){startLesson(t.dataset.redo,true)}
  else if(t.dataset.z){
    if(t.dataset.z==='fit'){setZoom(mapFit(),false);$('#map').scrollLeft=0;$('#map').scrollTop=0}
    else setZoom(MS.s*(t.dataset.z==='in'?1.25:0.8));
  }
  else if(t.dataset.theme){collapsed[t.dataset.theme]=!collapsed[t.dataset.theme];renderMe()}
  else go('home');
});

var rz=0;
window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(cur==='home')renderHome()},150)});

/* ================= boot ================= */
load();
startRoll();
route();
})();
</script>
</body>
</html>
